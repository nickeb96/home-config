# Note: on macOS the config dir for rustfmt is erroneously considered
# to be "~/Library/Application Support", run
#   ln -s ../../.config/rustfmt ~/Library/'Application Support'
# to fix.

edition = "2024"
newline_style = "Unix"
tab_spaces = 2
max_width = 119
# comment_width = 99 # unstable
# blank_lines_upper_bound = 2 # unstable
use_small_heuristics = "Off"
reorder_imports = true
# group_imports = "StdExternalCrate" # unstable
# where_single_line = true # unstable
